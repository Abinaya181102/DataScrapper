name: Build and Push Docker Images

on:
  push:
    branches:
      - Elakkia

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build backend Docker image
      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ds-backend:latest ./DataScrapper.Backend

      # 4️⃣ Push backend image
      - name: Push Backend Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ds-backend:latest

      # 5️⃣ Build frontend dist
      - name: Build Frontend
        run: |
          cd DataScrapper.Frontend
          npm install
          npm run build
          # Copy the dist folder into nginx directory
          cp -r dist ../nginx/dist
          cd ..

      # 6️⃣ Build NGINX Docker image (with frontend dist)
      - name: Build Nginx Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ds-frontend:latest ./nginx

      # 7️⃣ Push NGINX image
      - name: Push Nginx Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ds-frontend:latest
