version: "3.8"

services:
  backend:
    image: ds-backend:latest
    deploy:
      replicas: 2
    networks:
      - app_net

  frontend:
    image: ds-frontend:latest
    deploy:
      replicas: 2
    networks:
      - app_net

  nginx:
    image: ds-nginx:latest
    ports:
      - "8080:80"
    deploy:
      replicas: 1
    networks:
      - app_net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Qwerty@1234"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    networks:
      - app_net

networks:
  app_net:
    driver: overlay
    attachable: true
